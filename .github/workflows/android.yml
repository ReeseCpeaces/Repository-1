name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk grove.apk
          # Every build must carry the same signing certificate, or phones can't update.
          keytool -printcert -jarfile grove.apk | grep -i 'SHA256:'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grove-apk
          path: grove.apk
      # A fixed "latest" release gives the phone a direct download link for the newest build.
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest grove.apk --target "$GITHUB_SHA" --prerelease \
            --title "Grove 0.1.${GITHUB_RUN_NUMBER} (latest build)" --notes "Version 0.1.${GITHUB_RUN_NUMBER}, built from ${GITHUB_SHA::7}. Download grove.apk on your phone to install or update. Your version is shown at the bottom of Grove's Settings."
